enabled: true
state-dir: E:\LY\Tool\CPA\registerbot
capture-evidence: true
gateway:
    proxy-url: http://127.0.0.1:12450
    auto-discover: true
    verify-exit-ip: true
    exit-ip-url: https://api.ipify.org?format=json
    share-mode: lease
    pin-timeout-seconds: 20
    probe-timeout-seconds: 5
    circuit-threshold: 3
    circuit-cooldown-seconds: 60
proxy-pool:
    mode: enforce
    max-usable-accounts-per-ip: 3
    failure-cooldown-seconds: 60
browser:
    mode: embedded
    chrome-paths:
        - C:\Program Files\Google\Chrome\Application\chrome.exe
        - C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
    pool-size: 2
    window-width: 1440
    window-height: 900
    startup-timeout-seconds: 40
    step-timeout-seconds: 120
    human-wait-seconds: 300
    retire-after: 8
    remote-debug-port: 9333
import:
    family: openai-compatibility
    verify-url: https://api.freeaiapikey.com/v1/models
channels:
    - id: freeaiapikey
      kind: freeaiapikey
      name: FreeAIapikey
      enabled: true
      provider: FreeAi
      proxy-url: http://127.0.0.1:12450
      concurrency: 1
      group: 节点选择
      rotate-node: true
      interval-seconds: 5
      step-delay-millis: 900
      max-attempts: 2
      onboarding-role: student
      onboarding-source: google
      skip-optional-discord: true
